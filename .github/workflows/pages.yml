# Build the component, check it in a real browser, and publish the page to
# GitHub Pages.
#
# This needs one repository setting to work: Settings -> Pages -> Build and
# deployment -> Source: GitHub Actions.

name: Pages

on:
  push:
    branches: [main]
  # Run the checks on pull requests too.  Without this the first time
  # anything runs is after a merge, which is how a broken check-site reached
  # main and blocked the deploy behind it.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way.  Keyed by
# ref so a pull request's checks do not queue behind main's deploys.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  WASI_SDK_VERSION: "34.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 has JSPI on by default, which the terminal test needs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml

      - name: Cache wasi-sdk
        id: wasi-sdk
        uses: actions/cache@v4
        with:
          path: ~/wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux

      - name: Install wasi-sdk
        if: steps.wasi-sdk.outputs.cache-hit != 'true'
        run: |
          major="${WASI_SDK_VERSION%%.*}"
          curl -fsSL \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$major/wasi-sdk-$WASI_SDK_VERSION-x86_64-linux.tar.gz" \
            | tar xz -C "$HOME"

      - run: npm ci

      - name: Build
        run: make site WASI_SDK="$HOME/wasi-sdk-$WASI_SDK_VERSION-x86_64-linux"

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Play the game, in the browser and in the terminal
        run: make check

      - name: Play the game in Firefox too, on both builds
        run: |
          make check-browser BROWSER=firefox
          make check-preview1 BROWSER=firefox

      # SLOW_MODULE holds the page's entry module back, so the checks that
      # race against it fail here rather than only on a slow runner.
      - name: Play the game in the tree that is about to be published
        run: SLOW_MODULE=1 make check-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Pull requests get the checks above, but only main is published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
